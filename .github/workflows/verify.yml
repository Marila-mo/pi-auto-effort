name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '22.x']
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Record verification environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Revision: $(git rev-parse HEAD)"
            echo "Runner: ubuntu-24.04"
            echo "Prerequisites: lockfile dependencies, Node >=22.19.0 with Zstandard, available IPv4 loopback port. No vendor credentials or API calls."
            echo "Reproduction: npm ci --ignore-scripts && npm run verify"
            echo "Expected: typecheck, unit tests, isolated tool-loop E2E, and catalog E2E all pass."
          } | tee artifacts/verify.log
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee -a artifacts/verify.log
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee -a artifacts/verify.log
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verification-node-${{ matrix.node }}
          path: |
            artifacts/*.json
            artifacts/verify.log
            artifacts/catalog-*.ts
            artifacts/catalog-*.patch
          retention-days: 14
          if-no-files-found: warn
